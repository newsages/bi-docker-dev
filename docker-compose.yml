version: "3"
services:
  eco-zookeeper:
    build: eco-zookeeper/
    container_name: eco-zookeeper
    hostname: eco-zookeeper
    environment:
      - ZOO_CONF_DIR=/conf
      - ZOO_DATA_DIR=/data 
      - ZOO_DATA_LOG_DIR=/datalog 
      - ZOO_LOG_DIR=/logs 
      - ZOO_TICK_TIME=2000 
      - ZOO_INIT_LIMIT=5 
      - ZOO_SYNC_LIMIT=2 
      - ZOO_AUTOPURGE_PURGEINTERVAL=0
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
      - ZOO_MAX_CLIENT_CNXNS=60
      - ZOO_STANDALONE_ENABLED=true
      - ZOO_ADMINSERVER_ENABLED=true
    ports:
      - 30001:8080 # Zookeeper ADMINSERVER http://localhost:30001/commands/
      - 30002:2181 # Zookeeper  
      - 30003:2888 
      - 30004:3888 


  eco-nifi:
    build: eco-nifi/
    container_name: eco-nifi
    hostname: eco-nifi
    ports:
      - 30010:8080 # Unsecured HTTP Web Port
      - 30011:8443 
      - 30012:8082
      - 30013:10000 
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_CLUSTER_IS_NODE=true
      - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
      - NIFI_ZK_CONNECT_STRING=eco-zookeeper:2181
      - NIFI_ELECTION_MAX_WAIT=1 min
    links:
      - eco-zookeeper:eco-zookeeper
    depends_on:
      - eco-zookeeper
  

