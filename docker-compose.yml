version: "3.1"
services:
  
  # Kafka/Zookeeper container
  eco-kafka:
    build: eco-kafka/
    container_name: eco-kafka
    environment:
      - ADVERTISED_HOST=eco-kafka
      - LOG_RETENTION_HOURS=1
      - AUTO_CREATE_TOPICS=false
      - KAFKA_CREATE_TOPICS=divolte:4:1
    ports:
      - 9092:9092 # kafka broker
      - 2181:2181 # Zookeeper
  
  # Divolte container
  eco-divolte:
    build: eco-divolte/
    container_name: eco-divolte
    environment:
      - DIVOLTE_KAFKA_BROKER_LIST=eco-kafka:9092
    volumes:
      - ./conf/divolte/:/opt/divolte/divolte-collector-0.5.0/conf/
    ports:
      - 8290:8290
    depends_on:
      - eco-kafka
    links:
      - eco-kafka:eco-kafka

  # Druid container
  eco-druid:
    build: eco-druid/
    container_name: eco-druid
    ports:
      - 8081:8081
      - 8082:8082
    depends_on:
      - eco-kafka
    links:
      - eco-kafka:eco-kafka
  
  # Superset container
  docker-superset:
    build: eco-superset/
    container_name: eco-superset
    ports:
      - 8088:8088
    links:
      - eco-druid:eco-druid
  # Superset container
  eco-app:
    build: app/
    container_name: eco-app
    ports:
      - 8090:8090

