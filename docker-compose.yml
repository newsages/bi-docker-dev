version: "3.3"
services:
  ############################################
  #ZooKeepr Cluster
  zk1:
    build: eco-zookeeper/
    container_name: $ZOO_HOSTNAME_1
    hostname: $ZOO_HOSTNAME_1
    #user: "${ZOO_UID}:${ZOO_GID}"
    environment:
      - ZOO_HOME_DIR=${ZOO_HOME_DIR}
      - ZOO_TICK_TIME=2000 
      - ZOO_INIT_LIMIT=5 
      - ZOO_SYNC_LIMIT=2 
      - ZOO_AUTOPURGE_PURGEINTERVAL=0
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
      - ZOO_MAX_CLIENT_CNXNS=60
      - ZOO_STANDALONE_ENABLED=true
      - ZOO_ADMINSERVER_ENABLED=true
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_MY_ID=1
      - ZOO_SERVERS=ZOO_SERVERS=server.1=${ZOO_HOSTNAME_1}:2888:3888;2181 server.2=${ZOO_HOSTNAME_2}:2888:3888;2181 server.3=${ZOO_HOSTNAME_3}:2888:3888;2181
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 50M
        reservations:
          cpus: '0.25'
          memory: 20M
    volumes:
      - zk1:${ZOO_HOME_DIR}:z

  zk2:
    build: eco-zookeeper/
    container_name: $ZOO_HOSTNAME_2
    hostname: $ZOO_HOSTNAME_2
    #user: "${ZOO_UID}:${ZOO_GID}"
    environment:
      - ZOO_HOME_DIR=${ZOO_HOME_DIR}
      - ZOO_TICK_TIME=2000 
      - ZOO_INIT_LIMIT=5 
      - ZOO_SYNC_LIMIT=2 
      - ZOO_AUTOPURGE_PURGEINTERVAL=0
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
      - ZOO_MAX_CLIENT_CNXNS=60
      - ZOO_STANDALONE_ENABLED=true
      - ZOO_ADMINSERVER_ENABLED=true
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_MY_ID=2
      - ZOO_SERVERS=ZOO_SERVERS=server.1=${ZOO_HOSTNAME_1}:2888:3888;2181 server.2=${ZOO_HOSTNAME_2}:2888:3888;2181 server.3=${ZOO_HOSTNAME_3}:2888:3888;2181
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 50M
        reservations:
          cpus: '0.25'
          memory: 20M
    volumes:
      - zk2:${ZOO_HOME_DIR}:z

  zk3:
    build: eco-zookeeper/
    container_name: $ZOO_HOSTNAME_3
    hostname: $ZOO_HOSTNAME_3
    #user: "${ZOO_UID}:${ZOO_GID}"
    environment:
      - ZOO_HOME_DIR=${ZOO_HOME_DIR}
      - ZOO_TICK_TIME=2000 
      - ZOO_INIT_LIMIT=5 
      - ZOO_SYNC_LIMIT=2 
      - ZOO_AUTOPURGE_PURGEINTERVAL=0
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
      - ZOO_MAX_CLIENT_CNXNS=60
      - ZOO_STANDALONE_ENABLED=true
      - ZOO_ADMINSERVER_ENABLED=true
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_MY_ID=3
      - ZOO_SERVERS=ZOO_SERVERS=server.1=${ZOO_HOSTNAME_1}:2888:3888;2181 server.2=${ZOO_HOSTNAME_2}:2888:3888;2181 server.3=${ZOO_HOSTNAME_3}:2888:3888;2181
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 50M
        reservations:
          cpus: '0.25'
          memory: 20M
    volumes:
      - zk3:${ZOO_HOME_DIR}:z      
  # END ZooKeeper Cluster    
  ##############################################################################3

  ##############################################################################3
  # NiFi
  eco-nifi:
    build: eco-nifi/
    container_name: ${NIFI_HOSTNAME}
    hostname: ${NIFI_HOSTNAME}
    ports:
      - ${NIFI_WEB_HTTP_PORT_EXTERNAL}:${NIFI_WEB_HTTP_PORT} # Unsecured HTTP Web Port
      - ${NIFI_WEB_HTTPS_PORT_EXTERNAL}:${NIFI_WEB_HTTPS_PORT}
      - ${NIFI_CLUSTER_NODE_PROTOCOL_PORT_EXTERNAL}:${NIFI_CLUSTER_NODE_PROTOCOL_PORT}
      - ${NIFI_REMOTE_INPUT_SOCKET_PORT_EXTERNAL}:${NIFI_REMOTE_INPUT_SOCKET_PORT}
    environment:
      - NIFI_VERSION=${NIFI_VERSION}
      - NIFI_BASE_DIR=${NIFI_BASE_DIR}
      #- NIFI_LOG_DIR=${NIFI_LOG_DIR}
      #- NIFI_HOME=${NIFI_HOME}
      #- NIFI_TOOLKIT_HOME=${NIFI_TOOLKIT_HOME}
      - NIFI_CLUSTER_NODE_PROTOCOL_PORT=${NIFI_CLUSTER_NODE_PROTOCOL_PORT}
      - NIFI_WEB_HTTP_PORT=${NIFI_WEB_HTTP_PORT}
      - NIFI_WEB_HTTPS_PORT=${NIFI_WEB_HTTPS_PORT}
      - NIFI_REMOTE_INPUT_SOCKET_PORT=${NIFI_REMOTE_INPUT_SOCKET_PORT}
      - NIFI_CLUSTER_IS_NODE=${NIFI_CLUSTER_IS_NODE}
      #- NIFI_ZK_CONNECT_STRING=${NIFI_ZK_CONNECT_STRING}
      - NIFI_ZK_CONNECT_STRING=${ZOO_HOSTNAME_1}:2181,${ZOO_HOSTNAME_2}:2181,${ZOO_HOSTNAME_3}:2181
      - NIFI_ZK_ROOT_NODE=${NIFI_ZK_ROOT_NODE}
      - NIFI_ELECTION_MAX_WAIT=${NIFI_ELECTION_MAX_WAIT}
    volumes:
      - nifi:${NIFI_BASE_DIR}:z
      #- nifi_home:${NIFI_HOME}/conf
    depends_on:
      - $ZOO_HOSTNAME_1
      - $ZOO_HOSTNAME_2
      - $ZOO_HOSTNAME_3
  # END NiFi
