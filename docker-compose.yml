version: "3"
services:
#ZooKeepr Cluster
  zk1:
    build: eco-zookeeper/
    container_name: zk1
    hostname: zk1
    environment:
      - ZOO_CONF_DIR=/conf
      - ZOO_DATA_DIR=/data 
      - ZOO_DATA_LOG_DIR=/datalog 
      - ZOO_LOG_DIR=/logs 
      - ZOO_TICK_TIME=2000 
      - ZOO_INIT_LIMIT=5 
      - ZOO_SYNC_LIMIT=2 
      - ZOO_AUTOPURGE_PURGEINTERVAL=0
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
      - ZOO_MAX_CLIENT_CNXNS=60
      - ZOO_STANDALONE_ENABLED=true
      - ZOO_ADMINSERVER_ENABLED=true
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=0.0.0.0:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
    volumes:
      - 'zk1:/var/lib/zookeeper'      
    #ports:
      #- 30011:8080 # Zookeeper ADMINSERVER http://localhost:30001/commands/
      #- 30012:2181 # Zookeeper  
      #- 30003:2888 
      #- 30004:3888 

  zk2:
    build: eco-zookeeper/
    container_name: zk2
    hostname: zk2
    environment:
      - ZOO_CONF_DIR=/conf
      - ZOO_DATA_DIR=/data 
      - ZOO_DATA_LOG_DIR=/datalog 
      - ZOO_LOG_DIR=/logs 
      - ZOO_TICK_TIME=2000 
      - ZOO_INIT_LIMIT=5 
      - ZOO_SYNC_LIMIT=2 
      - ZOO_AUTOPURGE_PURGEINTERVAL=0
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
      - ZOO_MAX_CLIENT_CNXNS=60
      - ZOO_STANDALONE_ENABLED=true
      - ZOO_ADMINSERVER_ENABLED=true
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_MY_ID=2
      - ZOO_SERVERS=server.1=zk1:2888:3888;2181 server.2=0.0.0.0:2888:3888;2181 server.3=zk3:2888:3888;2181
    volumes:
      - 'zk2:/var/lib/zookeeper'      
    #ports:
      #- 30021:8080 # Zookeeper ADMINSERVER http://localhost:30011/commands/
      #- 30022:2181 # Zookeeper  
      #- 30003:2888 
      #- 30004:3888 

  zk3:
    build: eco-zookeeper/
    container_name: zk3
    hostname: zk3
    environment:
      - ZOO_CONF_DIR=/conf
      - ZOO_DATA_DIR=/data 
      - ZOO_DATA_LOG_DIR=/datalog 
      - ZOO_LOG_DIR=/logs 
      - ZOO_TICK_TIME=2000 
      - ZOO_INIT_LIMIT=5 
      - ZOO_SYNC_LIMIT=2 
      - ZOO_AUTOPURGE_PURGEINTERVAL=0
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
      - ZOO_MAX_CLIENT_CNXNS=60
      - ZOO_STANDALONE_ENABLED=true
      - ZOO_ADMINSERVER_ENABLED=true
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_MY_ID=3
      - ZOO_SERVERS=server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=0.0.0.0:2888:3888;2181
    volumes:
      - 'zk3:/var/lib/zookeeper'      
    #ports:
      #- 30031:8080 # Zookeeper ADMINSERVER http://localhost:30011/commands/
      #- 30032:2181 # Zookeeper  
      #- 30003:2888 
      #- 30004:3888 

  #NiFi Cluster
  eco-nifi:
    build: eco-nifi/
    #container_name: eco-nifi
    #hostname: eco-nifi
    ports:
      - 30100-30109:8080 # Unsecured HTTP Web Port
      - 30110-30119:8443 
      - 30120-30129:8082
      - 30130-30139:10000 
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_CLUSTER_IS_NODE=true
      - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
      - NIFI_ZK_CONNECT_STRING=zk1:2181,zk2:2181,zk3:2181
      - NIFI_ZK_ROOT_NODE=
      - NIFI_ELECTION_MAX_WAIT=1 min
      #- NIFI_ELECTION_MAX_CANDIDATES=10
